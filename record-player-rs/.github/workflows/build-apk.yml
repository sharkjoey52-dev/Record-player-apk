name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 32-bit (armeabi-v7a) is what older Fire tablets use; 64-bit is for newer ones.
      - name: Build the Rust app for Android
        run: cargo ndk -t armeabi-v7a -t arm64-v8a --platform 21 -o android/app/src/main/jniLibs build --release --lib

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: record-player-apk
          path: android/app/build/outputs/apk/release/*.apk
